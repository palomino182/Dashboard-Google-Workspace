<style>
  /* Consola de operaciones: un solo tema oscuro. Mono para cifras y etiquetas, sans para lectura.
     Estado: rojo = liberar, ámbar = revisar, verde apagado = mantener. Cian = controles. */
  :root {
    --ink-0: #0b1015; --ink-1: #0f1419; --ink-2: #151c23; --ink-3: #1c252e; --line: #26323d;
    --txt: #d6dee5; --txt-2: #8696a3; --txt-3: #5d6b77;
    --accent: #4fc3d9; --rojo: #ff6b5e; --ambar: #f2b33d; --verde: #3f8f72;

    --color-bg: var(--ink-1); --color-panel: var(--ink-2); --color-fg: var(--txt); --color-fg-muted: var(--txt-2);
    --color-border-line: var(--line); --cds-text-secondary: var(--txt-2);
    --c1: var(--rojo); --c2: var(--ambar); --cds-chart-muted: var(--verde);
    --cds-surface-popover: var(--ink-3); --cds-border: #33424f; --cds-shadow-popover: 0 8px 28px rgba(0, 0, 0, .55);
    --color-bad: var(--rojo);
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --font-anthropic-sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-anthropic-serif: var(--mono);
    --cds-font-size-caption: 12px; --cds-font-size-body: 14px; --cds-font-size-heading: 16px; --cds-font-size-title: 26px;
    --cds-font-weight-medium: 600;
    --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 20px; --cds-gap-xl: 36px;
    --cds-pad-sm: 6px; --cds-pad-md: 10px; --cds-pad-lg: 16px; --cds-radius: 6px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink-1); color: var(--txt); font: 14px/1.5 var(--font-anthropic-sans); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  ::selection { background: rgba(79, 195, 217, .3); }

  /* Indicador de estado */
  .pg-dot { width: 8px; height: 8px; border-radius: 50%; background: #3ecf8e; box-shadow: 0 0 0 3px rgba(62, 207, 142, .15); flex: none; }
  @media (prefers-reduced-motion: no-preference) { .pg-dot { animation: pg-pulso 2.4s ease-in-out infinite; } }
  @keyframes pg-pulso { 50% { box-shadow: 0 0 0 6px rgba(62, 207, 142, 0); } }
  .pg-brand { display: flex; align-items: center; gap: 10px; font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--txt); }

  /* Login */
  .pg-login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background-image: linear-gradient(var(--ink-2) 1px, transparent 1px), linear-gradient(90deg, var(--ink-2) 1px, transparent 1px);
    background-size: 32px 32px; background-position: center; }
  .pg-card { width: min(100%, 380px); background: var(--ink-0); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
  .pg-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--ink-2); }
  .pg-card-head span:last-child { font: 11px var(--mono); color: var(--txt-3); }
  .pg-card-body { padding: 22px 20px 20px; display: grid; gap: 14px; }
  .pg-card h1 { font: 600 18px/1.3 var(--mono); margin: 0; letter-spacing: -.01em; }
  .pg-card h1::before { content: "› "; color: var(--accent); }
  .pg-card p { margin: 0; color: var(--txt-2); font-size: 13px; }
  .pg-field { display: grid; gap: 6px; font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--txt-2); }
  .pg-field input { font: 14px var(--mono); letter-spacing: 0; text-transform: none; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--ink-1); color: var(--txt); }
  .pg-field input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(79, 195, 217, .18); }
  .pg-btn { font: 600 13px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 11px; border-radius: 6px; border: 0; background: var(--accent); color: var(--ink-0); cursor: pointer; }
  .pg-btn:hover { filter: brightness(1.08); }
  .pg-btn:focus-visible { outline: 2px solid var(--txt); outline-offset: 2px; }
  .pg-btn:disabled { opacity: .6; cursor: progress; }
  .pg-err { color: var(--rojo) !important; min-height: 1.3em; font: 12px var(--mono) !important; }

  /* Barra superior */
  .pg-bar { position: sticky; top: 0; z-index: 20; background: rgba(11, 16, 21, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .pg-bar-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .pg-sesion { display: flex; align-items: center; gap: 12px; font: 12px var(--mono); color: var(--txt-2); }
  .pg-sesion button { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; background: none; border: 1px solid var(--line); color: var(--txt); border-radius: 5px; padding: 5px 10px; cursor: pointer; }
  .pg-sesion button:hover { border-color: var(--rojo); color: var(--rojo); }
  #dash-root { max-width: 1240px; margin: 0 auto; padding: 28px 16px 56px; }

  /* Clases del tipo Dashboard */
  .dash-select { font: 12px var(--mono); color: var(--txt); background-color: var(--ink-0); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
  .dash-select:focus { border-color: var(--accent); outline: none; }
  .dash-skeleton { color: transparent !important; background: var(--ink-3); border-radius: 4px; min-width: 2ch; display: inline-block; }

  /* Ajustes del dashboard para la consola */
  #dash-root .lw-title { font-size: clamp(20px, 3vw, 26px); font-weight: 600; letter-spacing: -.02em; }
  #dash-root .lw-title::before { content: "› "; color: var(--accent); }
  #dash-root .lw-lede { font-size: 15px; color: var(--txt-2); }
  #dash-root .lw-lede b { color: var(--txt); font-family: var(--mono); font-weight: 600; }
  #dash-root .lw-src { font-family: var(--mono); font-size: 11px; color: var(--txt-3); }
  #dash-root .lw-h2 { font: 600 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--txt-2); }
  #dash-root .lw-h2::before { content: "// "; color: var(--txt-3); }
  #dash-root .lw-h3 { font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--txt-3); }
  #dash-root .lw-hint { color: var(--txt-3); }

  #dash-root .lw-card { background: var(--ink-2); border-color: var(--line); }
  #dash-root .lw-card-label { font: 500 11px var(--mono); letter-spacing: .14em; color: var(--txt-3); }
  #dash-root .lw-big { font-weight: 500; font-size: clamp(30px, 4vw, 40px); letter-spacing: -.03em; }
  #dash-root .lw-big small { font-family: var(--mono); color: var(--txt-3); }
  #dash-root .lw-card-note b { font-family: var(--mono); }
  #dash-root .lw-card--main { border-color: rgba(255, 107, 94, .55); background: linear-gradient(180deg, rgba(255, 107, 94, .08), transparent 70%), var(--ink-2); }
  #dash-root .lw-card--main .lw-big { color: var(--rojo); }
  #dash-root #kpi-suspendidas .lw-big { color: var(--txt); }

  #dash-root .lw-step { background: var(--ink-2); border-color: var(--line); }
  #dash-root .lw-step--first { border-color: rgba(255, 107, 94, .55); }
  #dash-root .lw-step-n { border-radius: 4px; background: transparent; color: var(--accent); border: 1px solid rgba(79, 195, 217, .5); font-family: var(--mono); }
  #dash-root .lw-step--first .lw-step-n { color: var(--rojo); border-color: rgba(255, 107, 94, .6); }
  #dash-root .lw-step--side .lw-step-n { color: var(--ambar); border: 1px dashed rgba(242, 179, 61, .6); }
  #dash-root .lw-tag { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--rojo); border-color: rgba(255, 107, 94, .6); padding: 2px 8px; }
  #dash-root .lw-step-fig b { font-weight: 500; }
  #dash-root .lw-step-fig .lw-gb { font-family: var(--mono); }

  #dash-root .lw-btn { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; background: transparent; color: var(--txt); border-color: var(--line); padding: 6px 10px; }
  #dash-root .lw-btn:hover { border-color: var(--accent); color: var(--accent); }
  #dash-root .lw-btn--strong { background: var(--accent); color: var(--ink-0); border-color: var(--accent); }
  #dash-root .lw-btn--strong:hover { color: var(--ink-0); filter: brightness(1.08); }
  #dash-root .lw-export-msg { font-family: var(--mono); }

  #dash-root .lw-chart text.lw-val { font-family: var(--mono); }
  #dash-root .lw-legend { font-family: var(--mono); font-size: 11px; }
  #dash-root .lw-tip { font-family: var(--mono); }

  #dash-root .lw-search { font: 12px var(--mono); background-color: var(--ink-0); }
  #dash-root .lw-search:focus { border-color: var(--accent); outline: none; }
  #dash-root .lw-count { font-family: var(--mono); color: var(--txt-3); }
  #dash-root .lw-tablewrap { background: var(--ink-0); border-color: var(--line); }
  #dash-root .lw-table th { background: var(--ink-2); font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--txt-3); }
  #dash-root .lw-table td { border-bottom-color: #1b242d; }
  #dash-root .lw-table td.mail, #dash-root .lw-table td.num { font-family: var(--mono); font-size: 11.5px; }
  #dash-root .lw-table td:nth-child(3) { min-width: 180px; }
  #dash-root .lw-table tbody tr:hover td { background: rgba(79, 195, 217, .05); }
  #dash-root .lw-chip { font: 500 10.5px var(--mono); border-radius: 4px; }
  #dash-root .lw-foot summary { font-family: var(--mono); font-size: 12px; }
</style>
</head>

<script>
(function () {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function descifrar(usuario, clave) {
    const material = new TextEncoder().encode(usuario.trim().toLowerCase() + '\n' + clave);
    const base = await crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plano = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, key, b64(P.ct));
    return JSON.parse(new TextDecoder().decode(plano));
  }

  // Reemplazo mínimo de la API del tipo Dashboard (dash.*) para que la página corra fuera de Claude
  function montarDash(rows) {
    const calcs = {}, draws = {}, cache = {};
    const correr = (name) => {
      const fn = draws[name]; if (!fn) return;
      document.querySelectorAll('[data-draw="' + name + '"]').forEach((el) => {
        try { fn(el); } catch (e) { console.error('draw ' + name, e); }
      });
    };
    window.dash = {
      colors: ['var(--c1)', 'var(--c2)', 'var(--cds-chart-muted)'],
      calc(id, def) { calcs[id] = def; },
      loader() {},
      data(id) {
        if (id === 'cuentas') return {status: 'ok', data: rows};
        const c = calcs[id];
        if (!c) return {status: 'missing', data: []};
        if (!(id in cache)) cache[id] = c.fn(...c.inputs.map((i) => window.dash.data(i).data));
        return {status: 'ok', data: cache[id]};
      },
      draw(name, fn) {
        if (typeof fn === 'function') draws[name] = fn;
        else if (fn && fn.update) draws[name] = (el) => fn.update(el, el.__m || (el.__m = fn.mount ? fn.mount(el) : null));
        if (!fn || window.dash.__listo) correr(name);
      },
      onData(fn) { try { fn(); } catch (e) { console.error(e); } },
      params() { return {}; }, setParams() {}, resetParams() {}, setLink() {}, refresh() {},
      __correrTodo() { Object.keys(draws).forEach(correr); }
    };
    window.claude = {
      use: async (n) => n !== 'downloads' ? null : {
        save: async ({filename, data}) => {
          const url = URL.createObjectURL(new Blob([data], {type: filename.endsWith('.pdf') ? 'application/pdf' : 'application/octet-stream'}));
          const a = document.createElement('a'); a.href = url; a.download = filename;
          document.body.append(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          return {status: 'saved'};
        }
      }
    };
  }

  function ejecutar(codigo) { const s = document.createElement('script'); s.textContent = codigo; document.body.append(s); }

  function montarApp(datos, usuario) {
    montarDash(datos.rows);
    const tpl = document.createElement('template');
    tpl.innerHTML = datos.html;
    const scripts = [...tpl.content.querySelectorAll('script')];
    scripts.forEach((s) => s.remove());
    document.getElementById('dash-root').replaceChildren(tpl.content);
    document.getElementById('login').hidden = true;
    document.getElementById('app').hidden = false;
    document.getElementById('quien').textContent = 'Sesión: ' + usuario;
    for (const s of scripts) {
      if (s.getAttribute('src') === 'pdf.js') ejecutar(datos.pdf);
      else if (!s.getAttribute('src')) ejecutar(s.textContent);
    }
    window.dash.__listo = true;
    window.dash.__correrTodo();
    let t; let ancho = window.innerWidth;
    window.addEventListener('resize', () => {
      if (window.innerWidth === ancho) return; ancho = window.innerWidth;
      clearTimeout(t); t = setTimeout(() => window.dash.__correrTodo(), 150);
    });
  }

  document.getElementById('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById('entrar'), err = document.getElementById('err');
    const usuario = document.getElementById('usuario').value, clave = document.getElementById('clave').value;
    btn.disabled = true; btn.textContent = 'Verificando…'; err.textContent = '';
    try {
      const datos = await descifrar(usuario, clave);
      document.getElementById('clave').value = '';
      montarApp(datos, usuario.trim());
    } catch (e) {
      err.textContent = 'Usuario o clave incorrectos.';
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  });
  document.getElementById('salir').addEventListener('click', () => location.reload());
})();
</script>
